name: "Infrastructure CI Trigger"



on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main



jobs:

  terraform-plan:

    name: "Terraform Plan"

    runs-on: ubuntu-latest

    

    # Environment variables for AWS Authentication

    env:

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      AWS_REGION: "us-east-1"



    steps:

      - name: Checkout Code

        uses: actions/checkout@v4



      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.7.0" # Locking version for consistency



      - name: Terraform Init

        # The -upgrade flag is the "magic" fix for your module error

        run: terraform init -upgrade



      - name: Terraform Format Check

        run: terraform fmt -check



      - name: Terraform Plan

        id: plan

        # -out=tfplan saves the result to a file as required by your project

        run: terraform plan -no-color -out=tfplan



      - name: Upload Plan Artifact

        # This fulfills the "Upload plan artifact" task in your project

        uses: actions/upload-artifact@v4

        with:

          name: terraform-plan-output

          path: tfplan
